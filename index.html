:root{
  --bg1:#fdf7ff; --bg2:#eef5ff; --ink:#3b3352; --muted:#7a7290;
  --lav:#cdb8ec; --lav-d:#9b82c9; --pink:#f8c8dc; --pink-d:#e391b5; --mint:#c4ecd9; --mint-d:#4f9f7f;
  --sky:#c4e1f7; --butter:#fbe9ad; --peach:#fdd5c0; --card:#ffffff; --rose:#e9a3a3;
  --radius:28px; --shadow:0 6px 18px rgba(120,100,170,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:"Andika","Avenir Next",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 12% 18%,#fff 0 2px,transparent 3px),radial-gradient(circle at 82% 12%,#fff 0 2px,transparent 3px),
  radial-gradient(circle at 70% 78%,#fff 0 2px,transparent 3px),radial-gradient(circle at 25% 85%,#fff 0 2px,transparent 3px)}
/* ---------- home ---------- */
#home{justify-content:center;gap:2vh;padding:3vh 4vw}
#home h1{font-size:clamp(40px,7vmin,76px);margin:0;letter-spacing:.5px;color:var(--lav-d)}
#home .uni-wrap{width:min(34vmin,320px);flex:none}
.big-start{flex:none;width:min(22vmin,200px);height:min(22vmin,200px);border-radius:50%;background:var(--mint);box-shadow:var(--shadow), inset 0 -8px 0 rgba(0,0,0,.06);
  display:flex;align-items:center;justify-content:center}
.big-start svg{width:45%;height:45%}
.big-start:active{transform:scale(.97)}
.grownup{position:fixed;top:14px;right:14px;background:rgba(255,255,255,.7);border-radius:16px;padding:10px 14px;font-size:15px;color:var(--muted)}
.speaker-home{position:fixed;top:14px;left:14px}
.rainbow-box{width:min(80vw,62vmin,620px);flex:none}
/* ---------- play ---------- */
#play{padding:0}
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px}
.homebtn{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.75);font-size:26px;display:flex;align-items:center;justify-content:center}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;max-width:70vw}
.dots i{width:12px;height:12px;border-radius:50%;background:#e6def3;display:block}
.dots i.done{background:var(--lav)}
.dots i.cur{background:var(--pink-d)}
.speaker{width:96px;height:96px;border-radius:50%;background:var(--sky);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:none}
.speaker svg{width:52px;height:52px}
.speaker.talking{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(196,225,247,.55)}}
.playmain{flex:1;width:100%;display:grid;grid-template-columns:120px 1fr 120px;align-items:center;min-height:0}
.leftcol{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;height:100%}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;height:100%;padding:8px}
.rightcol{display:flex;align-items:flex-end;justify-content:center;height:100%;padding-bottom:20px}
.next{width:104px;height:104px;border-radius:50%;background:var(--mint-d);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:opacity .3s}
.next.show{visibility:visible;opacity:1}
.next svg{width:56px;height:56px}
.uni-corner{position:fixed;left:8px;bottom:6px;width:150px;pointer-events:none}
.row{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center;align-items:center}
.tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);min-width:min(22vmin,170px);height:min(22vmin,170px);padding:0 3vmin;
  font-size:min(15vmin,120px);font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;position:relative;transition:transform .08s, box-shadow .2s, background .2s}
.tile:active{transform:scale(.97)}
.tile.pic{font-size:min(13vmin,104px)}
.tile.pair{font-size:min(10vmin,80px);gap:1vmin;min-width:min(30vmin,240px)}
.tile.wordt{font-size:min(11vmin,92px);min-width:min(28vmin,220px)}
.tile.good{background:#e9f8f0;box-shadow:0 0 0 6px var(--mint-d)}
.tile.miss{box-shadow:0 0 0 5px var(--rose);opacity:.7}
.tile.hint{animation:glow 1.3s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px var(--butter),var(--shadow)}}
.tile.small{min-width:min(14vmin,110px);height:min(14vmin,110px);font-size:min(10vmin,80px);border-radius:22px}
.bigletter{font-size:min(34vmin,280px);font-weight:700;line-height:1;background:var(--card);border-radius:40px;box-shadow:var(--shadow);padding:2vmin 6vmin;position:relative}
.bigletter .upper{font-size:30%;color:var(--muted);position:absolute;right:16px;top:12px}
.word{display:flex;gap:.5vmin;background:var(--card);border-radius:36px;box-shadow:var(--shadow);padding:2vmin 4vmin;position:relative}
.word .g{font-size:min(20vmin,160px);font-weight:700;line-height:1.1;padding:0 .4vmin;border-radius:18px;transition:background .2s,color .2s;position:relative}
.word .g.lit{background:var(--butter)}
.word .g.heart::after{content:"♥";position:absolute;left:50%;transform:translateX(-50%);top:-.15em;font-size:30%;color:var(--pink-d)}
.word.sm .g{font-size:min(12vmin,96px)}
.sweep{position:absolute;left:4vmin;right:4vmin;bottom:1.2vmin;height:8px;border-radius:4px;background:var(--lav);transform-origin:left;transform:scaleX(0)}
.sweep.go{transition:transform .9s linear;transform:scaleX(1)}
.slots{display:flex;gap:2vmin}
.slot{width:min(18vmin,140px);height:min(20vmin,150px);border-radius:24px;border:5px dashed var(--lav);display:flex;align-items:center;justify-content:center;font-size:min(14vmin,110px);font-weight:700;background:rgba(255,255,255,.5)}
.slot.filled{border-style:solid;background:#fff}
.tile.used{visibility:hidden}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sentence{display:flex;flex-wrap:wrap;gap:2.2vmin;justify-content:center;background:var(--card);border-radius:36px;box-shadow:var(--shadow);padding:3vmin 4vmin;max-width:92%}
.sentence .w{font-size:min(10vmin,84px);font-weight:700;padding:0 .6vmin;border-radius:14px}
.sentence .w.lit{background:var(--butter)}
.sparkle{position:absolute;pointer-events:none;inset:-20px}
.sparkle span{position:absolute;font-size:18px;color:#f3c34f;opacity:0;animation:spk .5s ease-out forwards}
@keyframes spk{0%{opacity:0;transform:scale(.4)}35%{opacity:.95}100%{opacity:0;transform:scale(1) translateY(-6px)}}
.uni .head{transform-origin:120px 95px;transition:transform .5s ease}
.uni.nod .head{transform:rotate(8deg)}
.uni.tilt .head{transform:rotate(-10deg)}
.uni .body{animation:breathe 4s ease-in-out infinite;transform-origin:100px 150px}
@keyframes breathe{50%{transform:scaleY(1.015)}}
/* ---------- finish ---------- */
#finish{justify-content:center;gap:3vh;padding:4vh 4vw;text-align:center}
#finish h2{font-size:clamp(34px,6vmin,60px);margin:0;color:var(--lav-d)}
.summary{display:flex;gap:2vmin;flex-wrap:wrap;justify-content:center;max-width:80vw}

/* ---------- celebrations (brief, gentle, after a correct first try) ---------- */

  background:linear-gradient(#f8c8dc 0 17%,#fdd5c0 0 34%,#fbe9ad 0 51%,#c4ecd9 0 68%,#c4e1f7 0 85%,#cdb8ec 0);animation:c-trail 1.6s cubic-bezier(.45,.05,.55,.95) forwards}
@keyframes c-trail{0%{width:0;opacity:.85}80%{opacity:.85}100%{width:105vw;opacity:0}}

@keyframes rbpop{0%{transform:scale(1)}40%{transform:scale(1.9);fill:#f3c34f}100%{transform:scale(1)}}

.dbglog{max-height:260px;overflow:auto;background:#f6f2fb;border-radius:12px;padding:10px;font-size:12px;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
#dbgOverlay{position:fixed;left:6px;bottom:6px;z-index:60;max-width:46vw;margin:0;padding:6px 8px;font-size:10px;line-height:1.3;background:rgba(255,255,255,.85);border-radius:8px;pointer-events:none;white-space:pre-wrap;color:#555}

<body>
<section class="screen" id="home"></section>
<section class="screen" id="play"></section>
<section class="screen" id="finish"></section>
<section class="screen" id="dash"></section>
<div id="celebrate"></div>
<div class="modal" id="modal"></div>
<script>
// ===================== CURRICULUM DATA =====================
// Letter order: Mentava/UFLI-style quick start (continuous sounds + short a first), one new letter per level.
// tts = spelling fed to speechSynthesis to approximate the pure sound (see RESEARCH/README limitation notes).
const LETTERS = [
 {id:'a', tts:'aah', key:'apple',  stop:false, pics:[['apple','🍎'],['ant','🐜'],['axe','🪓']]},
 {id:'m', tts:'mmmm', key:'moon',  stop:false, pics:[['moon','🌙'],['monkey','🐒'],['mouse','🐭'],['milk','🥛']]},
 {id:'s', tts:'sss', key:'sun',    stop:false, pics:[['sun','☀️'],['sock','🧦'],['snake','🐍'],['star','⭐']]},
 {id:'t', tts:'tuh', key:'tiger',  stop:true,  pics:[['tiger','🐯'],['tent','⛺'],['turtle','🐢'],['tomato','🍅']]},
 {id:'p', tts:'puh', key:'pig',    stop:true,  pics:[['pig','🐷'],['pizza','🍕'],['penguin','🐧'],['pear','🍐']]},
 {id:'i', tts:'ih', key:'itchy',   stop:false, pics:[]},
 {id:'n', tts:'nnnn', key:'nose',  stop:false, pics:[['nose','👃'],['nut','🥜'],['net','🥅']]},
 {id:'f', tts:'fff', key:'fish',   stop:false, pics:[['fish','🐟'],['fox','🦊'],['frog','🐸']]},
 {id:'o', tts:'ah', key:'octopus', stop:false, pics:[['octopus','🐙'],['otter','🦦'],['ox','🐂']]},
 {id:'d', tts:'duh', key:'dog',    stop:true,  pics:[['dog','🐶'],['duck','🦆'],['drum','🥁'],['door','🚪']]},
 {id:'c', tts:'kuh', key:'cat',    stop:true,  pics:[['cat','🐱'],['car','🚗'],['cake','🍰'],['cow','🐮']]},
 {id:'g', tts:'guh', key:'goat',   stop:true,  pics:[['goat','🐐'],['gift','🎁'],['guitar','🎸'],['gorilla','🦍']]},
 {id:'u', tts:'uh', key:'up',      stop:false, pics:[['umbrella','☂️'],['up','⬆️']]},
 {id:'b', tts:'buh', key:'bus',    stop:true,  pics:[['bus','🚌'],['bee','🐝'],['banana','🍌'],['bear','🐻']]},
 {id:'e', tts:'eh', key:'egg',     stop:false, pics:[['egg','🥚'],['elephant','🐘'],['elf','🧝']]},
 {id:'h', tts:'huh', key:'hat',    stop:true,  pics:[['hat','🎩'],['horse','🐴'],['house','🏠'],['heart','❤️']]},
 {id:'r', tts:'rrrr', key:'rabbit',stop:false, pics:[['rabbit','🐇'],['rainbow','🌈'],['robot','🤖'],['rose','🌹']]},
 {id:'l', tts:'llll', key:'lion',  stop:false, pics:[['lion','🦁'],['leaf','🍃'],['lemon','🍋'],['log','🪵']]},
 {id:'k', tts:'kuh', key:'kite',   stop:true,  pics:[['kite','🪁'],['key','🔑'],['koala','🐨'],['kangaroo','🦘']]},
 {id:'j', tts:'juh', key:'juice',  stop:true,  pics:[['juice','🧃'],['jeans','👖'],['jar','🫙']]},
 {id:'w', tts:'wuh', key:'worm',   stop:false, pics:[['worm','🪱'],['watermelon','🍉'],['web','🕸️'],['wolf','🐺']]},
 {id:'y', tts:'yuh', key:'yarn',   stop:false, pics:[['yarn','🧶'],['yo-yo','🪀'],['yawn','🥱']]},
 {id:'v', tts:'vvvv', key:'van',   stop:false, pics:[['van','🚐'],['violin','🎻'],['volcano','🌋']]},
 {id:'x', tts:'ks', key:'box',     stop:true,  noTTS:true, endKey:true, pics:[]},
 {id:'z', tts:'zzzz', key:'zebra', stop:false, pics:[['zebra','🦓'],['zero','0️⃣']]},
 {id:'qu',tts:'kwuh', key:'queen', stop:true,  pics:[['queen','👸']]},
];
const LMAP = Object.fromEntries(LETTERS.map((l,i)=>[l.id,{...l,level:i+1}]));
const SAME_SOUND = {c:'k',k:'c'}; // never use as foils for each other

// Heart words: [word, level, indexes of the "heart" (irregular / not-yet-taught) letters]
const HEARTS = [
 ['the',4,[2]], ['I',6,[0]], ['is',7,[1]], ['a',7,[0]], ['to',9,[1]], ['was',11,[1,2]], ['of',13,[0,1]],
 ['you',14,[1,2]], ['said',15,[1,2]], ['he',16,[1]], ['she',16,[0,1,2]], ['we',17,[1]], ['me',17,[1]],
 ['be',18,[1]], ['are',18,[0,2]], ['do',20,[1]], ['go',21,[1]], ['no',21,[1]], ['so',22,[1]], ['my',22,[1]],
 ['see',23,[1,2]], ['look',25,[1,2]], ['like',26,[1,3]],
];
const HMAP = Object.fromEntries(HEARTS.map(([w,l,h])=>[w.toLowerCase(),{w,level:l,heart:h}]));

// Decodable words (short vowel, only taught letters). emoji optional (needed for picture activities).
const WORDLIST = `am at sat mat map:🗺️ tap:🚰 pat sap sip sit tip pit it pin:📌 nap:😴 pan:🍳 man:👨 ant:🐜 an in nip tin
fan fin fit fat fist:✊ on top:🔝 mop pot:🍲 not pop stop:🛑 dot dad pad mad:😠 sad:😢 did dip nod pod and
cat:🐱 cap:🧢 can:🥫 cot cop:👮 dog:🐶 pig:🐷 dig:⛏️ gas:⛽ tag:🏷️ got fog:🌫️ sun:☀️ cup:🥤 mug:☕ nut:🥜 gum up:⬆️
cut:✂️ dug tug fun mud bus:🚌 bat:🦇 bag:👜 bug:🐛 bib cub tub:🛁 big bud:🌱 cab:🚕 bun bin:🗑️ bed:🛏️ pen:🖊️ ten:🔟
net:🥅 pet beg egg:🥚 men get set tent:⛺ hat:🎩 hen:🐔 hot:🔥 hug:🤗 hop him hut:🛖 hit ham:🍖 rat:🐀 rug red:🔴
run:🏃 ram:🐏 rip rod:🎣 rib rub leg:🦵 log:🪵 lip:👄 lid lap let lot kid:🧒 kit jam jet:✈️ jog jug job web:🕸️ wig
wet:💧 win:🏆 wag yes:✅ yet yum:😋 yak van:🚐 vet fox:🦊 box:📦 six mix wax ox:🐂 fix zip zap:⚡ quit quiz:❓`
 .trim().split(/\s+/).map(s=>{const [w,e]=s.split(':');return {w,e:e||null};});

// Decodable sentences, answered by picking the matching picture pair [subject, thing].
const SENTENCES = [
 ['Dad can nap.','👨','😴'], ['The ant is on the map.','🐜','🗺️'], ['Dad is sad.','👨','😢'], ['Dad is mad.','👨','😠'],
 ['The cat is sad.','🐱','😢'], ['The cat can nap.','🐱','😴'], ['The pig is mad.','🐷','😠'], ['The dog can dig.','🐶','⛏️'],
 ['The pig can nap.','🐷','😴'], ['The sun is up.','☀️','⬆️'], ['The bug is on the cup.','🐛','🥤'], ['The bug is in the bag.','🐛','👜'],
 ['The cat is in the bag.','🐱','👜'], ['The bug was on the cup.','🐛','🥤'], ['The cat is on the bed.','🐱','🛏️'], ['The dog is on the bed.','🐶','🛏️'],
 ['The hen is on the bed.','🐔','🛏️'], ['The sun is hot.','☀️','🔥'], ['Dad got a hat.','👨','🎩'], ['The cat got a hat.','🐱','🎩'],
 ['I can hug Mom.','🤗','👩'], ['The rat can run.','🐀','🏃'], ['The hen is red.','🐔','🔴'], ['The bed is red.','🛏️','🔴'],
 ['The bus is red.','🚌','🔴'], ['I can run to the bus.','🏃','🚌'], ['The dog is on the log.','🐶','🪵'], ['The kid can hug the dog.','🤗','🐶'],
 ['The jet is up.','✈️','⬆️'], ['The fox is in the box.','🦊','📦'], ['The cat is in the box.','🐱','📦'], ['The dog is in the box.','🐶','📦'],
 ['You can pet the dog.','🫳','🐶'], ['The hen said yes.','🐔','✅'], ['We can see the sun.','👀','☀️'], ['Look at the big jet!','👀','✈️'],
];

'use strict';
// ===================== UTIL =====================
const $ = s => document.querySelector(s);
const QS = new URLSearchParams(location.search);
const MUTE = QS.has('mute');
// On-device debug log (Grown-ups → Debug log). Keeps the last 150 events and errors in localStorage so a parent can report them.
const DBG = { key:'anyaReads.debug', list:[],
  init(){ try { this.list = JSON.parse(localStorage.getItem(this.key) || '[]'); } catch(e){ this.list = []; }
    addEventListener('error', e => this.log('ERROR ' + (e.message || e) + (e.filename ? ' @' + String(e.lineno) : '')));
    addEventListener('unhandledrejection', e => this.log('PROMISE ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
    const w = console.warn.bind(console), er = console.error.bind(console);
    console.warn = (...a) => { this.log('warn ' + a.map(String).join(' ')); w(...a); }; console.error = (...a) => { this.log('error ' + a.map(String).join(' ')); er(...a); }; },
  log(msg){ const t = new Date(); const line = `${t.toTimeString().slice(0,8)} ${String(msg).slice(0,300)}`; this.list.push(line); if (this.list.length > 150) this.list.splice(0, this.list.length - 150);
    try { localStorage.setItem(this.key, JSON.stringify(this.list)); } catch(e){}
    const o = document.getElementById('dbgOverlay'); if (o){ o.textContent = this.list.slice(-8).join('\n'); } } };
DBG.init();          // testing: skip speech
const sleep = ms => new Promise(r => setTimeout(r, MUTE ? Math.min(ms, 20) : ms));
const DAY = 864e5;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MAXLEVEL = LETTERS.length;
function graphemes(word){ const w = word.toLowerCase(), out = []; for (let i = 0; i < w.length; i++){ if (w[i]==='q' && w[i+1]==='u'){ out.push('qu'); i++; } else out.push(w[i]); } return out; }
function wordLevel(w){ let m = 0; for (const g of graphemes(w)){ const L = LMAP[g]; if (!L) return 999; m = Math.max(m, L.level); } return m; }
const WORDS = WORDLIST.map(o => ({...o, level: wordLevel(o.w)})).filter(o => o.level <= MAXLEVEL);
const WMAP = Object.fromEntries(WORDS.map(o => [o.w, o]));
function tokenLevel(t){ const k = t.toLowerCase(); return HMAP[k] ? HMAP[k].level : wordLevel(k); }
const SENTS = SENTENCES.map(([s,a,b], i) => { const toks = s.replace(/[.!?,]/g,'').split(' '); return {id:'S:'+i, s, toks, a, b, hearts: toks.map(t => t.toLowerCase()).filter(t => HMAP[t]), level: Math.max(...toks.map(tokenLevel))}; }).filter(o => o.level <= MAXLEVEL);
const SMAP = Object.fromEntries(SENTS.map(o => [o.id, o]));

// ===================== STATE =====================
const KEY = 'anyaReads.v1';
function defaults(){ return { version:1, name:'Anya', level:1, created:Date.now(),
  settings:{ items:15, maxMin:10, voice:'', rate:0.85, soundMode:'tts', anim:true, speak:'grownup', speakN:3, asr:true, clips:true },
  items:{}, intro:{}, sessions:[], log:[], rainbow:0, spoken:{} }; }
let state;
function load(){ try { state = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch(e){ state = defaults(); }
  const d = defaults(); for (const k in d) if (state[k] === undefined) state[k] = d[k];
  state.settings = {...d.settings, ...state.settings}; if (!state.spoken) state.spoken = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ console.warn('save failed', e); } }

// Item helpers -------------------------------------------------------
// ids: L:m (letter sound), W:mat (decodable word), H:the (heart word), S:3 (sentence)
function itemLevel(id){ const [k, v] = [id[0], id.slice(2)];

// End-of-lesson celebration (about 4 s): the unicorn gallops along the rainbow arc to her new step in three
// bouncy strides, leaving sparkles, then twirls, and stars bloom around her. Calm, with no points.
// With reduced motion, or animations off, the unicorn just appears on the new step.
function finishCelebration(fromSteps, toSteps, per = 20){
  const u = document.querySelector('#finish #rbUni'); if (!u) return;
  const svg = u.ownerSVGElement, cx = 300, cy = 250, R = 236;
  const at = k => { const t = Math.PI - (k / (per - 1)) * Math.PI; return [cx + R * Math.cos(t), cy - R * Math.sin(t)]; };
  const k1 = toSteps % per; const a0 = Math.max(-1, k1 - 4); // a short run-up along the steps she's walked, so the gallop is visible even for one step
  const place = (x, y, rot = 0, sc = 1) => { u.setAttribute('x', x); u.setAttribute('y', y + 12); u.setAttribute('transform', `rotate(${rot} ${x} ${y}) translate(${x} ${y}) scale(${sc}) translate(${-x} ${-y})`); };
  const dot = svg.querySelectorAll('circle')[(k1 + per - 1) % per];
  if (!motionOK()){ const [x, y] = at(k1); place(x, y); return; }
  const mk = (x, y, cls, txt = '✦', extra = '') => { const e = document.createElementNS('http://www.w3.org/2000/svg', 'text'); e.setAttribute('x', x); e.setAttribute('y', y);
    e.setAttribute('text-anchor', 'middle'); e.setAttribute('class', cls); e.textContent = txt; if (extra) e.setAttribute('style', extra); svg.appendChild(e); return e; };
  const span = Math.max(1, k1 - a0), GALLOP = 2400, TWIRL = 900, strides = 3; let t0 = null, lastStride = -1;
  place(...at(a0), 0, 1);
  const frame = t => { if (!document.body.contains(u)) return; if (t0 === null) t0 = t; const e = t - t0;
    if (e < GALLOP){ const p = e / GALLOP, ease = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2; const k = a0 + span * ease; const [x, y] = at(k);
      const stride = Math.floor(p * strides), sp = (p * strides) % 1; const hop = Math.sin(sp * Math.PI) * 26;
      place(x, y - hop, Math.sin(sp * Math.PI * 2) * -8, 1.35);
      if (stride !== lastStride){ lastStride = stride; const s = mk(x, y + 18, 'rb-spark'); setTimeout(() => s.remove(), 1400); }
      requestAnimationFrame(frame); return; }
    const [x, y] = at(k1);
    if (e < GALLOP + TWIRL){ const p = (e - GALLOP) / TWIRL; place(x, y - Math.sin(p * Math.PI) * 10, p * 360, 1.35 - .15 * p); requestAnimationFrame(frame); return; }
    place(x, y, 0, 1.2);

    for (let i = 0; i < 10; i++){ const ang = i * Math.PI / 5; const s = mk(x, y, 'rb-bloom', '✦', `--dx:${(Math.cos(ang) * 46).toFixed(1)}px;--dy:${(-Math.sin(ang) * 40).toFixed(1)}px;animation-delay:${i * 35}ms`); setTimeout(() => s.remove(), 1700); }
  };
  setTimeout(() => requestAnimationFrame(frame), 500);
}
function rainbowSVG(steps, per = 20, animateFrom = null){

let SESSION = null;
function chooseAct(id, rep){
  const k = id[0], v = id.slice(2), it = state.items[id];
  if (k === 'L'){ const hasPics = LMAP[v].pics.length > 0; return (hasPics && rep > 0 && it && it.a >= 2 && Math.random() < 0.4) ? 'letterPic' : 'hearTap'; }

    if (!(rep === 0 && !(it && it.a))) opts.push('build'); else if (!opts.length) opts.push('build');
    return pick(opts); }
}
function priority(id){
  const it = state.items[id], now = Date.now(), L = state.level; let p = Math.random() * 1.5;
  if (itemLevel(id) === L) p += 3; else if (itemLevel(id) >= L - 2) p += 1;

  else { p += (1 - recentAcc(it)) * 4; if (it.due <= now) p += 2 + Math.min(3, (now - it.due) / DAY); if (mastered(id)) p -= 1.5; }

}
function buildPlan(){
  const L = state.level, N = state.settings.items, avail = available(L);
  const entries = []; const count = {}; const add = (id, needIntro) => { entries.push({id, rep: count[id] || 0, needIntro}); count[id] = (count[id] || 0) + 1; };
  // 1. new letters + heart words for this level (taught, then retrieved 3x / 2x spaced)
  const newL = knownLetters(L).filter(l => !state.intro['L:'+l]).map(l => 'L:'+l);
  const newH = HEARTS.filter(h => h[1] <= L && !state.intro['H:'+h[0].toLowerCase()]).map(h => 'H:'+h[0].toLowerCase()).slice(0, 2);
  const newW = shuffle(WORDS.filter(w => (newL.length ? w.level < L : w.level <= L) && !state.intro['W:'+w.w])).sort((a,b) => b.level - a.level).slice(0, newL.length ? 1 : 3).map(w => 'W:'+w.w);
  newL.forEach(id => { add(id, true); add(id); add(id); });
  newH.forEach(id => { add(id, true); add(id); });
  newW.forEach(id => { add(id, true); add(id); });
  // 2. review: spaced, weakest/due first. Small pools repeat more (early levels).
  const heartReady = h => state.intro['H:'+h] || newH.includes('H:'+h);
  const pool = avail.filter(id => state.intro[id] || newL.includes(id) || newH.includes(id) || newW.includes(id) || (id[0] === 'S' && SMAP[id].hearts.every(heartReady)));
  const cap = pool.length < 4 ? 5 : pool.length < 10 ? 3 : 2;
  const ranked = pool.map(id => [id, priority(id)]).sort((a,b) => b[1] - a[1]).map(x => x[0]);
  let guard = 0;
  while (entries.length < N && guard++ < 200){ let added = false;
    for (const id of ranked){ if (entries.length >= N) break; if ((count[id] || 0) < cap && (count[id] || 0) < 1 + Math.floor(guard / 2)){ add(id); added = true; } }
    if (!added && guard > 12) break; }

  const scored = () => steps.filter(s => !s.teach).length;
  // put the earliest-needed intros first
  while (pending.length){
    const intros = pending.filter(e => e.needIntro && !(e.id in introAt));
    const canUse = e => !last.includes(e.id) && (!(newL.includes(e.id) || newH.includes(e.id) || newW.includes(e.id)) || (e.id in introAt && steps.length - introAt[e.id] >= 2));
    let elig = pending.filter(e => !e.needIntro && canUse(e));
    const lastTeach = steps.length && steps[steps.length-1].teach;
    if (intros.length && (!lastTeach) && (steps.length === 0 || Math.random() < 0.5 || !elig.length)){

    if (!elig.length) elig = pending.filter(e => !e.needIntro && (e.id in introAt || !(newL.includes(e.id)||newH.includes(e.id)||newW.includes(e.id))) && !last.includes(e.id));
    if (!elig.length) elig = pending.filter(e => !e.needIntro);
    if (!elig.length){ const e = pending.find(e => e.needIntro); if (!e) break; introAt[e.id] = steps.length; steps.push({teach:true, id:e.id, act: e.id[0]==='L'?'meet':e.id[0]==='H'?'heartMeet':'blendModel'}); e.needIntro = false; continue; }
    // prefer items whose reps are behind (spread reps), slight randomness
    elig.sort((a,b) => a.rep - b.rep || Math.random() - .5);
    const e = elig[0]; pending.splice(pending.indexOf(e), 1);
    steps.push({id:e.id, act: chooseAct(e.id, e.rep)}); last = [...last, e.id].slice(-2);

    const known = avail.filter(id => 'LW'.includes(id[0]) && state.items[id] && state.items[id].c >= 1);
    const id = known.length ? pick(known) : 'L:' + knownLetters(Math.max(1, L))[0];

  if (state.settings.speak !== 'off'){
    const cands = avail.filter(id => 'LWH'.includes(id[0]) && state.items[id] && state.items[id].c >= 2)
      .map(id => [id, (state.spoken[id] ? state.spoken[id].a : 0) + Math.random() * 1.5 - (state.spoken[id] && state.spoken[id].chk && recentAccSp(state.spoken[id]) < .8 ? 1 : 0)])

}

async function startSession(){

    const common = ['yes', 'listen', 'not quite listen', 'that word is', 'find', 'that is', 'that picture is', 'that says', 'there it is', 'starts with', 'that one says', 'we want'];
